# 本地开发环境（M1 骨架）：MySQL 8
# 用法：docker compose up -d
# 密码仅为本地开发默认值；生产环境（Sealos）使用平台托管数据库，不使用本文件。
# name：目录名含中文时 compose 无法自动推导项目名，需显式指定。

name: family-frame

services:
  mysql:
    image: mysql:8.0
    container_name: family-frame-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: family_frame_root
      MYSQL_DATABASE: family_frame
      MYSQL_USER: family_frame
      MYSQL_PASSWORD: family_frame
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pfamily_frame_root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 本地开发用 S3 兼容对象存储（M2 上传链路）。
  # 生产环境使用 Sealos Object Storage，不使用本服务。
  # MinIO 创建的 bucket 默认即 private，符合 PRD §10。
  minio:
    image: minio/minio:latest
    container_name: family-frame-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql-data:
  minio-data:
